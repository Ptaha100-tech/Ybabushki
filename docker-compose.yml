services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uchi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
      POSTGRES_DB: ${POSTGRES_DB:-uchi}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uchi} -d ${POSTGRES_DB:-uchi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-uchi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uchi}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в файле .env}
      FREE_DAILY_LIMIT: ${FREE_DAILY_LIMIT:-20}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-mock}
      DB_SYNC: ${DB_SYNC:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}

  web:
    build:
      context: ./app
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в файле .env (например, my-school-51.ru)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
