server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 512;

  # API проксируется на бэкенд
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Service worker и манифест не кэшируем надолго, чтобы обновления доходили сразу
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Файлы сборки с хэшем в имени кэшируем надолго
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Скачиваемые файлы (например, APK)
  location /downloads/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Всё остальное — одностраничное приложение
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
