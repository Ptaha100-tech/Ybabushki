name: Сборка Android APK

# Запуск вручную: вкладка Actions → «Сборка Android APK» → Run workflow.
# Готовый APK появится в Releases (тег apk-latest) и в артефактах запуска.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: Адрес API (с https)
        default: https://my-school-51.ru/api

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Установка зависимостей
        working-directory: app
        run: npm install
      - name: Выравнивание версий Expo
        working-directory: app
        run: npx expo install --fix || true
      - name: Генерация Android-проекта
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://my-school-51.ru/api' }}
        run: npx expo prebuild --platform android --no-install
      - name: Сборка APK
        working-directory: app/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://my-school-51.ru/api' }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Подпись APK
        env:
          # Если в настройках репозитория (Secrets) задан ключ — используется он,
          # иначе создаётся новый ключ на время этой сборки.
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Собран: $APK"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            PASS="$KS_PASS"
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore release.keystore -alias moyashkola -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass "$PASS" -keypass "$PASS" -dname "CN=Moya Shkola, C=RU"
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 "$APK" aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-key-alias moyashkola \
            --ks-pass pass:"$PASS" --key-pass pass:"$PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out moya-shkola.apk aligned.apk
          $BT/apksigner verify --verbose moya-shkola.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moya-shkola-apk
          path: moya-shkola.apk
      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Моя школа — Android APK
          files: moya-shkola.apk
